<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi twincita</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #f1e05a;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-block;
      background: rgba(241, 224, 90, 0.15);
      color: #fcd34d;
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    /* Animación del Girasol */
    .flower-box {
      width: 220px;
      height: 260px;
      margin: 0 auto 20px auto;
    }

    .stem, .leaf, .petal, .center {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawFlower 3.5s forwards ease-in-out;
    }

    .leaf { animation-delay: 0.8s; }
    .petal { animation-delay: 1.8s; }
    .center { animation-delay: 3s; }

    @keyframes drawFlower {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Botón con alto contraste */
    .btn-next {
      background-color: #00d2fe;
      color: #0d1117;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 210, 254, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-next:hover {
      background-color: #52e0ff;
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    /* Recadro de mensaje secundario para alto contraste */
    .message-card {
      margin-top: 20px;
      background-color: #21262d;
      border: 1px solid #30363d;
      border-left: 4px solid #f1e05a;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      line-height: 1.5;
      color: #f0f6fc;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PARA MI TWINCITA</h1>
    <div class="subtitle">¡Feliz 21 de Septiembre twin! <3</div>
    <div class="tag">Para mi Twincitabebe ✨</div>

    <!-- Animación Dibujada del Girasol -->
    <div class="flower-box">
      <svg viewBox="0 0 200 240" width="100%" height="100%">
        <!-- Tallo -->
        <path class="stem" d="M100 230 Q105 160 100 100" stroke="#4ade80" stroke-width="6" fill="none" stroke-linecap="round"/>
        
        <!-- Hojas -->
        <path class="leaf" d="M101 170 Q60 160 50 140 Q75 135 101 160" stroke="#22c55e" stroke-width="3" fill="#22c55e" />
        <path class="leaf" d="M100 150 Q140 140 150 120 Q125 115 100 140" stroke="#22c55e" stroke-width="3" fill="#22c55e" />

        <!-- Pétalos -->
        <g class="petal" stroke="#d97706" stroke-width="2" fill="#fbbf24">
          <path d="M100 80 Q100 20 100 35 Q100 50 100 80" />
          <path d="M100 80 Q125 25 120 38 Q110 50 100 80" />
          <path d="M100 80 Q145 40 135 55 Q120 65 100 80" />
          <path d="M100 80 Q155 65 142 80 Q125 85 100 80" />
          <path d="M100 80 Q150 95 135 105 Q120 100 100 80" />
          <path d="M100 80 Q130 120 118 122 Q108 110 100 80" />
          <path d="M100 80 Q100 135 100 125 Q100 110 100 80" />
          <path d="M100 80 Q70 120 82 122 Q92 110 100 80" />
          <path d="M100 80 Q50 95 65 105 Q80 100 100 80" />
          <path d="M100 80 Q45 65 58 80 Q75 85 100 80" />
          <path d="M100 80 Q55 40 65 55 Q80 65 100 80" />
          <path d="M100 80 Q75 25 80 38 Q90 50 100 80" />
        </g>

        <!-- Centro -->
        <circle class="center" cx="100" cy="80" r="22" fill="#78350f" stroke="#451a03" stroke-width="3" />
      </svg>
    </div>

    <!-- Botón para la segunda pantalla/mensaje -->
    <button id="btnContinue" class="btn-next" onclick="mostrarMensaje()">Presiona aquí</button>

    <!-- Contenido que aparece al presionar el botón -->
    <div id="extraMessage" class="message-card hidden">
      <p>🌻 Te quiero muchísimo, Twincita. Gracias por ser una persona tan especial en mi vida.</p>
    </div>
  </div>

  <script>
    function mostrarMensaje() {
      document.getElementById('extraMessage').classList.remove('hidden');
      document.getElementById('btnContinue').style.display = 'none';
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para ti 🌼✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0d17;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Contenedor universal de pantallas */
    .screen-overlay {
      position: absolute;
      z-index: 20;
      text-align: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Títulos e instrucciones */
    .title-main {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #cccccc;
      margin-bottom: 25px;
      font-weight: 300;
    }

    /* Botones principales */
    .btn-main {
      background: linear-gradient(135deg, #1e50ff 0%, #0022a1 100%);
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(30, 80, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-main:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(30, 80, 255, 0.6);
    }

    /* Botones de opción (Sí / No) */
    .options-container {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn-yes {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
      transition: all 0.3s ease;
    }

    .btn-no {
      background: #dc3545;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
      transition: all 0.3s ease;
    }

    .persuasion-msg {
      margin-top: 15px;
      font-size: 1.1rem;
      color: #ffeb3b;
      font-weight: 600;
      min-height: 25px;
    }

    /* Canvas para fondo y animaciones */
    #flowerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Botón flotante de Corazón (Pantalla final) */
    .heart-btn {
      position: absolute;
      bottom: 40px;
      z-index: 15;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(255, 105, 180, 0.3);
      border: 2px solid rgba(255, 182, 193, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
      transition: transform 0.2s, opacity 0.8s ease;
      user-select: none;
    }

    .heart-btn:hover {
      transform: scale(1.1);
    }

    .heart-btn:active {
      transform: scale(0.95);
    }

    /* Burbujas de Frases */
    .phrase-bubble {
      position: absolute;
      bottom: 130px;
      z-index: 25;
      background: rgba(255, 255, 255, 0.9);
      color: #222222;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: floatUp 3.5s forwards ease-out;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.8);
      }
      15% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-130px) scale(0.95);
      }
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: Inicio -->
  <div class="screen-overlay" id="screenIntro">
    <h1 class="title-main">PARA MI MEJOR AMIGA</h1>
    <p class="subtitle">¡Feliz 21 de Septiembre! 💛</p>
    <button class="btn-main" onclick="startFlowers()">Presiona aquí</button>
  </div>

  <!-- PANTALLA 2: Pregunta Interactiva (Aparece tras terminar las flores) -->
  <div class="screen-overlay hidden" id="screenQuestion">
    <h2 style="font-size: 2rem; margin-bottom: 10px;">¿Quieres pasar a lo siguiente? 🥺</h2>
    <div class="options-container">
      <button class="btn-yes" id="btnYes" onclick="goToHeartScreen()">¡Sí!</button>
      <button class="btn-no" id="btnNo" onclick="handleNoClick()">No</button>
    </div>
    <div class="persuasion-msg" id="persuasionMsg"></div>
  </div>

  <!-- PANTALLA 3: Botón de Corazón y Frases -->
  <div class="heart-btn hidden" id="heartBtn" onclick="spawnPhrase()">💖</div>

  <!-- Lienzo interactivo -->
  <canvas id="flowerCanvas"></canvas>

  <script>
    // --- FRASES BONITAS DEL SEGUNDO VIDEO ---
    const phrases = [
      "Eres hermosa sin esfuerzo.",
      "Tienes una mirada que destaca.",
      "Tu sonrisa tiene algo especial.",
      "Inteligente y segura, así eres.",
      "Bonita por dentro y por fuera.",
      "Me encanta tu forma de pensar.",
      "Tienes estilo y mucha personalidad.",
      "Eres fuerte, pero también muy dulce.",
      "Brillas sin hacer ruido.",
      "Tu vibra es de las que se quedan.",
      "Eres real, y eso vale mucho.",
      "Encantas sin intentarlo.",
      "Naturalmente linda.",
      "Siempre de buen gusto.",
      "Sabes estar sin querer llamar la atención.",
      "Eres increíble.",
      "Eres única."
    ];

    let phraseIndex = 0;

    function spawnPhrase() {
      const phraseText = phrases[phraseIndex];
      phraseIndex = (phraseIndex + 1) % phrases.length;

      const bubble = document.createElement('div');
      bubble.className = 'phrase-bubble';
      bubble.innerText = phraseText;

      const randomOffset = (Math.random() - 0.5) * 80;
      bubble.style.transform = translateX(${randomOffset}px);

      document.body.appendChild(bubble);

      setTimeout(() => {
        bubble.remove();
      }, 3500);
    }

    // --- MENSAJES PARA CONVENCER SI PRESIONA "NO" ---
    const persuasionMessages = [
      "¿Segura? Piénsalo bien... 🥺",
      "¡Por favor di que sí! 🙏",
      "¡Dale al Sí, te va a gustar! ✨",
      "¡Anda, no te hagas del rogar! 🙈",
      "¿De verdad presionarás que no otra vez? 💔",
      "¡El botón verde se ve más bonito! 💚",
      "¡Prometo que vale la pena! 🌟",
      "¡Ya casi no puedes presionar el No! 😂"
    ];

    let noClickCount = 0;
    let noScale = 1;
    let yesScale = 1;

    function handleNoClick() {
      noClickCount++;

      // Reducir tamaño del No y aumentar tamaño del Sí
      if (noScale > 0.25) noScale -= 0.12;
      yesScale += 0.15;

      const btnNo = document.getElementById('btnNo');
      const btnYes = document.getElementById('btnYes');
      const msgDiv = document.getElementById('persuasionMsg');

      btnNo.style.transform = scale(${noScale});
      btnYes.style.transform = scale(${yesScale});

      // Mostrar mensaje persuasivo
      const msgIndex = Math.min(noClickCount - 1, persuasionMessages.length - 1);
      msgDiv.innerText = persuasionMessages[msgIndex];
    }

    // --- FLUJO DE PANTALLAS ---
    function startFlowers() {
      document.getElementById('screenIntro').classList.add('hidden');
      animating = true;
      animate();
    }

    function showQuestionScreen() {
      document.getElementById('screenQuestion').classList.remove('hidden');
    }

    function goToHeartScreen() {
      document.getElementById('screenQuestion').classList.add('hidden');
      document.getElementById('heartBtn').classList.remove('hidden');
    }

    // --- CANVAS ANIMACIÓN DE GIRASOLES ---
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Fondo de estrellas parpadeantes
    const stars = Array.from({ length: 150 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random()
    }));

    function drawStars() {
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = rgba(255, 255, 255, ${star.alpha});
        ctx.fill();
        star.alpha += (Math.random() - 0.5) * 0.02;
        if (star.alpha < 0.2) star.alpha = 0.2;
        if (star.alpha > 1) star.alpha = 1;
      });
    }

    let progress = 0;
    let animating = false;
    let questionShown = false;

    function drawSunflower(centerX, centerY, scale, progressVal) {
      if (progressVal <= 0) return;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.scale(scale, scale);

      // Tallo
      ctx.beginPath();
      ctx.moveTo(0, 150);
      ctx.quadraticCurveTo(-10, 75, 0, 0);
      ctx.strokeStyle = '#2d8a4e';
      ctx.lineWidth = 6;
      ctx.stroke();

      // Hojas
      if (progressVal > 0.3) {
        let leafProgress = Math.min((progressVal - 0.3) / 0.3, 1);
        ctx.fillStyle = '#236e3e';
        
        ctx.beginPath();
        ctx.ellipse(-22 * leafProgress, 70, 25 * leafProgress, 10 * leafProgress, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(22 * leafProgress, 90, 25 * leafProgress, 10 * leafProgress, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Pétalos
      if (progressVal > 0.5) {
        let flowerScale = Math.min((progressVal - 0.5) / 0.5, 1);
        const petalCount = 12;
        ctx.fillStyle = '#fbc02d';

        for (let i = 0; i < petalCount; i++) {
          let angle = (i * Math.PI * 2) / petalCount;
          ctx.save();
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.ellipse(0, -32 * flowerScale, 12 * flowerScale, 30 * flowerScale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Centro
        ctx.beginPath();
        ctx.arc(0, 0, 18 * flowerScale, 0, Math.PI * 2);
        ctx.fillStyle = '#5d4037';
        ctx.fill();
      }

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawStars();

      if (animating) {
        if (progress < 1) {
          progress += 0.007; // Velocidad de crecimiento
        } else if (!questionShown) {
          questionShown = true;
          setTimeout(showQuestionScreen, 600); // Muestra la pregunta tras florecer completamente
        }

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 50;

        drawSunflower(centerX, centerY, 1.2, progress);

        if (progress > 0.2) {
          drawSunflower(centerX - 130, centerY + 30, 0.9, (progress - 0.2) * 1.25);
        }

        if (progress > 0.35) {
          drawSunflower(centerX + 130, centerY + 30, 0.9, (progress - 0.35) * 1.5);
        }
      }

      requestAnimationFrame(animate);
    }

    function init() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawStars();
      if (!animating) requestAnimationFrame(init);
    }
    init();
  </script>
</body>
</html>
